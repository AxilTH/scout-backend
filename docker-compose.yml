  # ============================================================
  # PostgreSQL для Education Service
  # ============================================================
  postgres_education:
    image: postgres:17-alpine
    container_name: scout-postgres-education
    environment:
      - POSTGRES_DB=scout_education
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_education_data:/var/lib/postgresql/data
    networks:
      - scout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

