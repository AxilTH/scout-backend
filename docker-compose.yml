# docker-compose.yml
services:
  # -------------------------------------------------
  # PostgreSQL — база данных для всех микросервисов
  # -------------------------------------------------
  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data  # данные сохраняются даже после остановки

  # -------------------------------------------------
  # MinIO — хранилище файлов (S3-совместимое)
  # -------------------------------------------------
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"  # Веб-интерфейс
    volumes:
      - minio_data:/data

  # -------------------------------------------------
  # Nginx — обратный прокси (API Gateway + фронтенд)
  # -------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"      # HTTP
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf  # наш конфиг
      - ../scout-frontend/dist:/usr/share/nginx/html    # статика фронтенда (из соседней папки!)
    depends_on:
      - education-service  # ждёт, пока запустится сервис

  # -------------------------------------------------
  # Education Service — наш первый микросервис на Go
  # -------------------------------------------------
  education-service:
    build: ./services/education
    environment:
      # Переменные окружения — способ передать настройки в контейнер
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - postgresql
      - minio

# -------------------------------------------------
# Именованные тома для хранения данных
# -------------------------------------------------
volumes:
  pg_data:
  minio_data: