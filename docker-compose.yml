services:
  # ============================================================
  # Education Service
  # ============================================================
  education-service:
    build:
      context: ./services/education
      dockerfile: Dockerfile
    container_name: scout-education
    environment:
      # Общие переменные (из корневого .env)
      - DB_HOST=postgres_education
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # Сервис-специфичные переменные
      - DB_NAME=scout_education
      - EDUCATION_SERVICE_PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      postgres_education:
        condition: service_healthy
    networks:
      - scout-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ============================================================
  # Squad & Membership Service
  # ============================================================
  squad-service:
    build:
      context: ./services/squad
      dockerfile: Dockerfile
    container_name: scout-squad
    environment:
      # Общие переменные (из корневого .env)
      - DB_HOST=postgres_squad
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      # Сервис-специфичные переменные
      - DB_NAME=scout_squad
      - SQUAD_SERVICE_PORT=8082
    ports:
      - "8082:8082"
    depends_on:
      postgres_squad:
        condition: service_healthy
    networks:
      - scout-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

