services:
  # -------------------------------------------------
  # PostgreSQL — база данных
  # -------------------------------------------------
  postgresql:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

  # -------------------------------------------------
  # MinIO — файловое хранилище
  # -------------------------------------------------
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"  # Веб-интерфейс MinIO
    volumes:
      - minio_data:/data

  # -------------------------------------------------
  # Education Service — микросервис на Go
  # -------------------------------------------------
  education-service:
    build: ./services/education
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DB_HOST: postgresql
      DB_PORT: "5432"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: on-failure

  # -------------------------------------------------
  # Nginx — API Gateway и фронтенд
  # -------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../scout-frontend/dist:/usr/share/nginx/html
    depends_on:
      education-service:
        condition: service_healthy
    restart: "no"

# -------------------------------------------------
# Именованные тома для хранения данных
# -------------------------------------------------
volumes:
  pg_data:   
  minio_data: 